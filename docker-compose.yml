services:
  db:
    image: postgres:16-alpine
    container_name: db_copilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Si el 5432 ya esta ocupado en tu maquina (otro Postgres local), definí
      # POSTGRES_PORT en tu .env (ej: POSTGRES_PORT=5433) y actualizá DATABASE_URL
      # para que apunte a ese puerto.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_copilot_pgdata:/var/lib/postgresql/data
      # Datos de demo precargados (solo se ejecutan la primera vez, con el volumen vacio).
      # Si preferis usar tu propia base, dejá DATABASE_URL en .env apuntando a otro servidor
      # y no hace falta levantar este contenedor.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_copilot_pgdata:
